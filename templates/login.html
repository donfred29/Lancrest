{% extends "base.html" %}
{% block title %}Login – Lancrest{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8">
        <h1 class="text-2xl font-bold text-navy-900 mb-6">Member Login</h1>

        {% if error %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" name="email" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-accent-500 focus:border-transparent outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-accent-500 focus:border-transparent outline-none">
            </div>
            <button type="submit" class="w-full bg-navy-900 hover:bg-navy-800 text-white py-3 rounded-xl font-semibold transition">
                Sign In
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-600">
            New member? <a href="/register" class="text-accent-600 font-medium hover:underline">Open an account</a>
        </p>

        <div class="mt-8 pt-6 border-t border-slate-100 text-xs text-slate-500 space-y-1">
            <p class="font-semibold text-slate-700">Demo Accounts</p>
            <p>Admin: <code>admin@lancrest.demo</code> / <code>admin123</code></p>
            <p>User: <code>sarah.johnson@lancrest.demo</code> / <code>password123</code></p>
        </div>
    </div>
</div>
{% endblock %}
